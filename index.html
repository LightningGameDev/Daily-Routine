<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F3EA;
    --pitch: #1F7A4D;
    --pitch-deep: #155A3B;
    --gold: #C8922A;
    --gold-deep: #8A611C;
    --sky: #2F5D8C;
    --ink: #1C2420;
    --line: rgba(28, 36, 32, 0.15);
    --rest: rgba(28, 36, 32, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    background: #ddd8c8;
    color: var(--ink);
    line-height: 1.5;
  }

  button, input, textarea { font-family: inherit; color: inherit; }

  .app { max-width: 700px; margin: 0 auto; padding: 28px 18px 60px; }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .eyebrow {
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(28, 36, 32, 0.5);
    margin-bottom: 2px;
  }

  h1 {
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 32px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .back-btn { display: inline-flex; align-items: center; gap: 6px; }

  /* Home hero */
  .home-hero {
    border-radius: 10px;
    padding: 22px 22px 24px;
    margin-bottom: 22px;
    color: var(--paper);
  }

  .home-hero.dt-school { background: var(--sky); }
  .home-hero.dt-training { background: var(--pitch-deep); }
  .home-hero.dt-matchday { background: var(--gold-deep); }
  .home-hero.dt-rest { background: var(--ink); }

  .home-hero-date {
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 8px;
  }

  .home-hero-type {
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 30px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .type-pill {
    display: inline-block;
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 6px 14px;
    border-radius: 30px;
    white-space: nowrap;
  }

  .type-pill.dt-school { background: rgba(47, 93, 140, 0.16); color: var(--sky); }
  .type-pill.dt-training { background: rgba(31, 122, 77, 0.16); color: var(--pitch-deep); }
  .type-pill.dt-matchday { background: rgba(200, 146, 42, 0.22); color: var(--gold-deep); }
  .type-pill.dt-rest { background: rgba(28, 36, 32, 0.12); color: var(--ink); }

  /* Home nav */
  .home-nav { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .home-nav-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .home-nav-btn {
    display: flex;
    text-align: left;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    background: var(--paper);
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    border-left: 6px solid var(--line);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }

  .home-nav-btn:hover { box-shadow: 0 3px 14px rgba(0,0,0,0.1); transform: translateY(-1px); }

  .home-nav-btn.primary { align-items: center; gap: 14px; padding: 18px; }
  .home-nav-btn.secondary { flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; }

  .home-nav-btn .hn-icon { flex-shrink: 0; opacity: 0.8; }
  .home-nav-btn .hn-text { display: flex; flex-direction: column; gap: 2px; }

  .home-nav-btn .hn-title {
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .home-nav-btn.primary .hn-title { font-size: 16px; }
  .home-nav-btn .hn-sub { font-size: 11.5px; color: rgba(28, 36, 32, 0.5); }

  .home-nav-btn.nav-skill { border-left-color: var(--pitch); }
  .home-nav-btn.nav-goals { border-left-color: var(--gold); }
  .home-nav-btn.nav-week { border-left-color: var(--sky); }
  .home-nav-btn.nav-homework { border-left-color: var(--sky); }
  .home-nav-btn.nav-saved { border-left-color: rgba(28, 36, 32, 0.4); }

  @media (max-width: 480px) { .home-nav-row { grid-template-columns: 1fr; } }

  /* Daily anchor tracker */
  .anchor-section { margin-bottom: 4px; }

  .anchor-card {
    background: var(--paper);
    border-radius: 6px;
    border-left: 6px solid var(--pitch);
    padding: 16px 18px 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }

  .anchor-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }

  .anchor-title {
    font-family: 'Oswald', Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .anchor-streak-stat { text-align: right; line-height: 1; }
  .anchor-streak-num { display: block; font-family: 'Oswald', Arial, sans-serif; font-size: 26px; font-weight: 700; color: var(--gold-deep); }
  .anchor-streak-label { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(28, 36, 32, 0.45); margin-top: 2px; }

  .anchor-list { display: flex; flex-direction: column; gap: 2px; }

  .anchor-item { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 4px; cursor: pointer; user-select: none; }
  .anchor-item:hover { background: rgba(28, 36, 32, 0.035); }

  .anchor-checkbox {
    width: 21px; height: 21px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: white; transition: background 0.15s ease, border-color 0.15s ease;
  }

  .anchor-checkbox.checked { background: var(--pitch); border-color: var(--pitch); }
  @keyframes anchorPop { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .anchor-checkbox.pop { animation: anchorPop 0.35s ease; }

  .anchor-label { font-size: 13.5px; }
  .anchor-item.done .anchor-label { color: rgba(28, 36, 32, 0.45); text-decoration: line-through; }

  .anchor-history { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }

  .anchor-history-title {
    font-family: 'Oswald', Arial, sans-serif; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: rgba(28, 36, 32, 0.4); margin-bottom: 8px;
  }

  .anchor-history-row { display: flex; gap: 6px; }
  .anchor-history-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }

  .anchor-history-label {
    font-family: 'Oswald', Arial, sans-serif; font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase; color: rgba(28, 36, 32, 0.4);
  }

  .anchor-history-dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(28, 36, 32, 0.08); }
  .anchor-history-dot.full { background: var(--pitch); }
  .anchor-history-dot.partial { background: var(--gold); }
  .anchor-history-day.is-today .anchor-history-label { color: var(--ink); }

  /* Skill focus */
  .skill-card { background: white; border-radius: 6px; border-left: 6px solid var(--pitch); padding: 18px 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }

  .skill-name-input {
    font-family: 'Oswald', Arial, sans-serif; font-size: 20px; font-weight: 700;
    border: none; background: transparent; width: 100%; padding: 4px 0; border-bottom: 1px solid transparent;
  }

  .skill-name-input:focus { outline: none; border-bottom-color: var(--line); }

  .skill-meta-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .skill-field { display: flex; flex-direction: column; gap: 3px; }

  .skill-field label {
    font-family: 'Oswald', Arial, sans-serif; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: rgba(28, 36, 32, 0.45);
  }

  .skill-field input { border: none; border-bottom: 1px solid var(--line); background: transparent; font-size: 13px; padding: 4px 2px; }

  .skill-days-left { font-family: 'Oswald', Arial, sans-serif; font-size: 13px; font-weight: 600; color: var(--gold-deep); margin-top: 14px; }

  .skill-log { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .skill-log-title { margin-bottom: 8px; }

  .skill-log-entry { font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .skill-log-date { color: rgba(28, 36, 32, 0.45); flex-shrink: 0; font-family: 'Oswald', Arial, sans-serif; font-size: 11px; font-weight: 600; }
  .skill-log-empty { font-size: 12px; color: rgba(28, 36, 32, 0.4); padding: 6px 0; }

  .skill-log-add { display: flex; gap: 8px; margin-top: 10px; }
  .skill-log-add input { flex: 1; border: none; border-bottom: 1px solid var(--line); background: transparent; font-size: 13px; padding: 6px 2px; }

  .skill-swap { margin-top: 18px; }

  /* Goal ladder */
  .goal-domain { background: white; border-radius: 6px; border-left: 6px solid var(--sky); padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }

  .goal-domain-title {
    font-family: 'Oswald', Arial, sans-serif; font-size: 15px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 8px;
  }

  .goal-tier { padding: 12px 0; border-top: 1px solid var(--line); }
  .goal-tier:first-of-type { border-top: none; }

  .goal-tier-label {
    font-family: 'Oswald', Arial, sans-serif; font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: rgba(28, 36, 32, 0.45); margin-bottom: 6px;
  }

  .goal-text { width: 100%; border: none; background: transparent; font-size: 13.5px; resize: vertical; min-height: 42px; padding: 4px 2px; font-family: inherit; }
  .goal-text:focus, .goal-reflection:focus { outline: none; background: rgba(28,36,32,0.03); }

  .goal-deadline-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .goal-deadline-row label { font-size: 11px; color: rgba(28, 36, 32, 0.5); white-space: nowrap; }
  .goal-deadline-input { flex: 1; border: none; border-bottom: 1px solid var(--line); background: transparent; font-size: 12.5px; padding: 4px 2px; }

  .goal-reflection {
    width: 100%; border: none; border-top: 1px dashed var(--line); background: transparent;
    font-size: 12.5px; font-style: italic; color: rgba(28, 36, 32, 0.7); resize: vertical;
    min-height: 34px; margin-top: 8px; padding: 8px 2px 2px; font-family: inherit;
  }

  .goal-complete-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: rgba(28, 36, 32, 0.6); cursor: pointer; }

  /* Homework tracker */
  .hw-card { background: white; border-radius: 6px; border-left: 6px solid var(--sky); padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }

  .hw-add-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
  .hw-add-row input[type="text"] { flex: 2 1 140px; }
  .hw-add-row input[type="date"] { flex: 1 1 120px; }
  .hw-add-row input {
    border: none; border-bottom: 1px solid var(--line); background: transparent; font-size: 13px; padding: 8px 4px;
  }
  .hw-add-row input:focus { outline: none; background: rgba(28,36,32,0.03); }
  .hw-add-row .btn { flex: 0 0 auto; }

  .hw-list { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }
  .hw-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .hw-item:last-child { border-bottom: none; }

  .hw-check {
    width: 21px; height: 21px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .hw-check.checked { background: var(--sky); border-color: var(--sky); }

  .hw-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hw-subject {
    font-family: 'Oswald', Arial, sans-serif; font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--sky);
  }
  .hw-title { font-size: 13.5px; }
  .hw-item.done .hw-title { color: rgba(28, 36, 32, 0.4); text-decoration: line-through; }
  .hw-item.done .hw-subject { color: rgba(28, 36, 32, 0.35); }

  .hw-due { font-family: 'Oswald', Arial, sans-serif; font-size: 11.5px; font-weight: 600; color: rgba(28, 36, 32, 0.5); white-space: nowrap; }
  .hw-item.overdue .hw-due { color: #b23b3b; }
  .hw-empty { font-size: 12.5px; color: rgba(28, 36, 32, 0.45); padding: 10px 2px; }

  .home-hw-section { margin-top: 18px; }

  .hw-more-btn {
    display: block; width: 100%; text-align: center; border: none; background: transparent;
    cursor: pointer; font-family: 'Oswald', Arial, sans-serif; font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--sky); padding: 10px 4px 2px;
  }
  .hw-more-btn:hover { text-decoration: underline; }

  .hw-status-text { font-size: 11.5px; color: rgba(28, 36, 32, 0.4); text-align: right; margin-top: 10px; }

  /* Sheet */
  .sheet { background: white; border-top: 8px solid var(--pitch); border-radius: 4px; padding: 22px 20px 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .sheet.type-matchday { border-top-color: var(--gold); }

  .sheet-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

  .badge-input {
    font-family: 'Oswald', Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    text-align: right; border: none; border-radius: 30px; padding: 7px 16px;
    background: rgba(28, 36, 32, 0.06); color: rgba(28, 36, 32, 0.65); flex: 1; max-width: 260px;
  }

  .badge-input:focus { outline: 2px solid var(--line); background: rgba(28,36,32,0.09); }

  .kickoff-row {
    display: flex; gap: 14px; flex-wrap: wrap; background: rgba(200, 146, 42, 0.08);
    border: 2px dashed var(--gold); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
  }

  .kickoff-field { flex: 1; min-width: 140px; }

  .kickoff-field label {
    display: block; font-family: 'Oswald', Arial, sans-serif; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold-deep); margin-bottom: 3px;
  }

  .kickoff-field input {
    width: 100%; border: none; border-bottom: 2px dotted rgba(200, 146, 42, 0.5); background: transparent;
    font-family: 'Oswald', Arial, sans-serif; font-size: 16px; font-weight: 600; color: var(--gold-deep); padding: 2px 0;
  }

  .kickoff-field input:focus { outline: none; border-bottom-color: var(--gold); }

  .blocks { display: flex; flex-direction: column; gap: 4px; }

  .row {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px;
    border-left: 5px solid var(--line); border-radius: 3px; flex-wrap: wrap;
  }

  .row:nth-child(even) { background: rgba(28, 36, 32, 0.025); }
  .row.style-train { border-left-color: var(--pitch); }
  .row.style-school { border-left-color: var(--sky); }
  .row.style-game { border-left-color: var(--gold); }
  .row.style-bed { border-left-color: rgba(28, 36, 32, 0.4); }
  .row.note-row { border-left-style: dashed; border-left-color: rgba(28,36,32,0.3); }

  .row-move { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }

  .icon-btn {
    border: none; background: transparent; cursor: pointer; color: rgba(28, 36, 32, 0.4);
    font-size: 10px; line-height: 1; padding: 3px 4px; border-radius: 3px;
  }

  .icon-btn:hover { background: rgba(28,36,32,0.08); color: var(--ink); }
  .icon-btn:disabled { opacity: 0.25; cursor: default; }
  .icon-btn:disabled:hover { background: transparent; }

  .row-fields { display: flex; gap: 10px; flex: 1 1 260px; min-width: 0; }

  .time-input {
    flex: 0 0 150px; border: none; background: transparent; font-variant-numeric: tabular-nums;
    font-size: 12.5px; font-weight: 600; font-family: 'Oswald', Arial, sans-serif;
    color: rgba(28, 36, 32, 0.6); padding: 5px 4px; border-bottom: 1px solid transparent; min-width: 0;
  }

  .label-input {
    flex: 1 1 auto; border: none; background: transparent; font-size: 13.5px; color: var(--ink);
    padding: 5px 4px; border-bottom: 1px solid transparent; min-width: 0;
  }

  .note-input {
    flex: 1 1 auto; border: none; background: transparent; font-size: 13px; font-style: italic;
    color: rgba(28, 36, 32, 0.65); padding: 5px 4px; border-bottom: 1px solid transparent; min-width: 0;
  }

  .time-input:focus, .label-input:focus, .note-input:focus { outline: none; border-bottom-color: var(--line); background: rgba(28,36,32,0.03); }

  .row.style-bed .label-input { font-weight: 700; }
  .label-input.emph { font-weight: 700; font-size: 14.5px; }

  .row-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .style-dots { display: flex; gap: 5px; }

  .dot { width: 15px; height: 15px; border-radius: 50%; border: none; cursor: pointer; padding: 0; outline-offset: 2px; }
  .dot-train { background: var(--pitch); }
  .dot-school { background: var(--sky); }
  .dot-game { background: var(--gold); }
  .dot-bed { background: rgba(28, 36, 32, 0.4); }
  .dot.active { outline: 2px solid var(--ink); }

  .big-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(28, 36, 32, 0.55); cursor: pointer; white-space: nowrap; }
  .big-toggle input { cursor: pointer; }

  .delete-btn { font-size: 16px; color: rgba(28,36,32,0.35); }
  .delete-btn:hover { color: #b23b3b; background: rgba(178,59,59,0.08); }

  .add-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .btn {
    font-family: 'Oswald', Arial, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em;
    border-radius: 6px; padding: 9px 14px; cursor: pointer; border: none;
  }

  .btn.ghost { background: rgba(28, 36, 32, 0.05); color: rgba(28, 36, 32, 0.7); }
  .btn.ghost:hover { background: rgba(28, 36, 32, 0.09); }
  .btn.subtle { background: transparent; color: rgba(28, 36, 32, 0.55); border: 1px solid var(--line); }
  .btn.subtle:hover { background: rgba(28,36,32,0.04); }
  .btn.danger { background: #b23b3b; color: white; }
  .btn.danger:hover { background: #9a3232; }

  .app-footer { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  .confirm-box { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(28,36,32,0.7); flex-wrap: wrap; }
  .status { font-size: 12px; color: rgba(28, 36, 32, 0.4); margin-left: auto; }
  .loading-note { text-align: center; padding: 60px 20px; color: rgba(28,36,32,0.5); font-size: 14px; }

  /* Week calendar */
  .week-section { margin-bottom: 20px; }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; }

  .week-tile {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 4px; border-radius: 8px; border: 2px solid transparent;
  }

  .week-tile.today { border-color: var(--ink); }
  .week-tile.selected { box-shadow: 0 0 0 2px var(--gold-deep) inset; }
  .week-tile.tint-school { background: rgba(47, 93, 140, 0.10); }
  .week-tile.tint-training { background: rgba(31, 122, 77, 0.10); }
  .week-tile.tint-matchday { background: rgba(200, 146, 42, 0.14); }
  .week-tile.tint-rest { background: rgba(28, 36, 32, 0.07); }

  .week-day-btn {
    border: none; background: none; cursor: pointer; font-family: 'Oswald', Arial, sans-serif;
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink); padding: 2px 4px; border-radius: 4px;
  }

  .week-day-btn:hover { background: rgba(28, 36, 32, 0.08); }
  .week-dots { display: flex; gap: 4px; }

  .week-type-label { font-size: 10px; font-weight: 600; text-align: center; }
  .week-type-label.c-school { color: var(--sky); }
  .week-type-label.c-training { color: var(--pitch-deep); }
  .week-type-label.c-matchday { color: var(--gold-deep); }
  .week-type-label.c-rest { color: rgba(28, 36, 32, 0.6); }

  .week-hint { font-size: 11.5px; color: rgba(28, 36, 32, 0.45); margin-top: 8px; }

  /* Saved week view */
  .wv-day {

  function dateKey(d) {
    var y = d.getFullYear();

  function daysBetween(aStr, bStr) {

    return Math.round((b - a) / 86400000);
  }

  function addMonthsToDateStr(dateStr, months) {
    var d = new Date(dateStr + "T00:00:00");
    var whole = Math.trunc(months);
    d.setMonth(d.getMonth() + whole);
    var frac = months - whole;
    if (frac) d.setDate(d.getDate() + Math.round(frac * 30));
    return dateKey(d);
  }

          blk("6:00 – 6:45 AM", "Technical session", "train", true),
          blk("6:45 – 6:48 AM", "Put football stuff away", "train"),

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function defaultDays() {
    var wm = defaultWeekMap();

    var days = {};
    WEEK_ORDER.forEach(function (day) {
      var type = wm[day];

  var storage = {
    get: function (key) {
      return new Promise(function (resolve) {
        try {
          var val = localStorage.getItem(key);
          resolve(val === null ? null : { key: key, value: val });
        } catch (e) { resolve(null); }
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve) {
        try {
          localStorage.setItem(key, value);
          resolve({ key: key, value: value });
        } catch (e) { resolve(null); }
      });
    }
  };

  function migrateFromOldFormat() {
    return Promise.all([
      storage.get("weekMap"),
      storage.get("schedule:school"),
      storage.get("schedule:training"),
      storage.get("schedule:matchday"),
      storage.get("schedule:rest")
    ]).then(function (results) {
      var oldWeekMapRaw = results[0];
      var oldTypeRaw = { school: results[1], training: results[2], matchday: results[3], rest: results[4] };
      var anyOldData = oldWeekMapRaw || oldTypeRaw.school || oldTypeRaw.training || oldTypeRaw.matchday || oldTypeRaw.rest;
      if (!anyOldData) return defaultDays();

      var wm;
      try { wm = oldWeekMapRaw && oldWeekMapRaw.value ? Object.assign(defaultWeekMap(), JSON.parse(oldWeekMapRaw.value)) : defaultWeekMap(); }
      catch (e) { wm = defaultWeekMap(); }

      var d = defaults();
      var days = {};
      WEEK_ORDER.forEach(function (day) {
        var type = wm[day];
        var raw = oldTypeRaw[type];
        var entry;
        if (raw && raw.value) {
          try { entry = JSON.parse(raw.value); } catch (e) { entry = clone(d[type]); }
        } else {
          entry = clone(d[type]);
        }
        entry.type = type;
        days[day] = entry;
      });
      return days;
    }).catch(function () { return defaultDays(); });
  }

  function loadDays() {
    return storage.get("days").then(function (res) {
      if (res && res.value) {
        try { return JSON.parse(res.value); } catch (e) { return migrateFromOldFormat(); }

      return migrateFromOldFormat();
    }).catch(function () { return migrateFromOldFormat(); });

      if (res && res.value) { try { return JSON.parse(res.value); } catch (e) { return goalLadderDefaults(); } }
      return goalLadderDefaults();
    }).catch(function () { return goalLadderDefaults(); });
  }

  function saveGoalLadder() { storage.set("goalLadder", JSON.stringify(state.goalLadder)).catch(function () {}); }

  function loadHomework() {
    return storage.get("homework").then(function (res) {
      if (res && res.value) { try { return JSON.parse(res.value); } catch (e) { return []; } }
      return [];
    }).catch(function () { return []; });
  }

  function setHwStatus(text) {
    var el = document.getElementById("hwStatusText");
    if (el) el.textContent = text;
  }

  function saveHomework() {
    setHwStatus("Saving…");
    storage.set("homework", JSON.stringify(state.homework)).then(function (res) {
      setHwStatus(res ? "Saved ✓" : "Couldn't save — try again");
    }).catch(function () { setHwStatus("Couldn't save — try again"); });
  }

  function formatDueDate(dueStr) {
    var d = new Date(dueStr + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function isAnchorDay(entry) {
    if (!entry) return false;
    return ANCHORS.every(function (a) { return !!entry[a.id]; });
  }

  function anchorsDoneCount(entry) {
    if (!entry) return 0;
    return ANCHORS.filter(function (a) { return !!entry[a.id]; }).length;
  }

  function computeStreak() {
    var streak = 0;
    var today = new Date();
    var todayEntry = state.anchorLog[dateKey(today)];
    if (isAnchorDay(todayEntry)) streak++;

    var cursor = new Date(today);
    cursor.setDate(cursor.getDate() - 1);
    while (true) {
      var entry = state.anchorLog[dateKey(cursor)];
      if (isAnchorDay(entry)) { streak++; cursor.setDate(cursor.getDate() - 1); }
      else break;
    }
    return streak;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderAnchorCard() {
    if (!anchorCardEl) return;
    var todayStr = dateKey(new Date());
    var entry = state.anchorLog[todayStr] || {};
    var streak = computeStreak();

    var itemsHtml = ANCHORS.map(function (a) {
      var checked = !!entry[a.id];
      var popClass = (checked && state.lastToggledAnchor === a.id) ? " pop" : "";
      return (
        '<div class="anchor-item' + (checked ? " done" : "") + '" data-anchor="' + a.id + '">' +
          '<span class="anchor-checkbox' + (checked ? " checked" : "") + popClass + '">' + (checked ? "✓" : "") + "</span>" +
          '<span class="anchor-label">' + escapeHtml(a.label) + "</span>" +
        "</div>"
      );
    }).join("");
    state.lastToggledAnchor = null;

    var historyRowHtml = "";
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var e = state.anchorLog[dateKey(d)];
      var doneCount = anchorsDoneCount(e);
      var cls = doneCount === ANCHORS.length ? "full" : (doneCount > 0 ? "partial" : "");
      var isToday = i === 0;
      var dayLabel = d.toLocaleDateString(undefined, { weekday: "narrow" });
      historyRowHtml +=
        '<div class="anchor-history-day' + (isToday ? " is-today" : "") + '">' +
          '<span class="anchor-history-dot ' + cls + '" title="' + doneCount + " of " + ANCHORS.length + ' anchors"></span>' +
          '<span class="anchor-history-label">' + escapeHtml(dayLabel) + "</span>" +
        "</div>";
    }

    anchorCardEl.innerHTML =
      '<div class="anchor-card-head">' +
        '<span class="anchor-title">Today\'s Anchors</span>' +
        '<span class="anchor-streak-stat"><span class="anchor-streak-num">' + streak + '</span><span class="anchor-streak-label">day streak</span></span>' +
      "</div>" +
      '<div class="anchor-list">' + itemsHtml + "</div>" +
      '<div class="anchor-history">' +
        '<p class="anchor-history-title">Last 7 Days</p>' +
        '<div class="anchor-history-row">' + historyRowHtml + "</div>" +
      "</div>";

    Array.prototype.forEach.call(anchorCardEl.querySelectorAll(".anchor-item"), function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-anchor");
        if (!state.anchorLog[todayStr]) state.anchorLog[todayStr] = {};
        var newVal = !state.anchorLog[todayStr][id];
        state.anchorLog[todayStr][id] = newVal;
        state.lastToggledAnchor = newVal ? id : null;
        saveAnchorLog();
        renderAnchorCard();
      });
    });
  }

  function renderHomeHomework() {
    var container = document.getElementById("homeHwCard");
    if (!container) return;
    var todayStr = dateKey(new Date());
    var pending = state.homework.filter(function (h) { return !h.completed; }).sort(function (a, b) {
      var ad = a.due || "9999-99-99";
      var bd = b.due || "9999-99-99";
      return ad < bd ? -1 : (ad > bd ? 1 : 0);
    });

    if (!pending.length) {
      container.innerHTML = '<p class="hw-empty">No homework due — you\'re clear.</p>';
      return;
    }

    var shown = pending.slice(0, 3);
    var rowsHtml = shown.map(function (item) {
      var overdue = item.due && item.due < todayStr;
      var dueLabel = item.due ? formatDueDate(item.due) : "";
      return (
        '<div class="hw-item' + (overdue ? " overdue" : "") + '" data-id="' + item.id + '">' +
          '<span class="hw-check"></span>' +
          '<div class="hw-info">' +
            (item.subject ? '<span class="hw-subject">' + escapeHtml(item.subject) + "</span>" : "") +
            '<span class="hw-title">' + escapeHtml(item.title) + "</span>" +
          "</div>" +
          '<span class="hw-due">' + escapeHtml(dueLabel) + "</span>" +
        "</div>"
      );
    }).join("");

    var moreHtml = pending.length > 3
      ? '<button class="hw-more-btn" id="homeHwMoreBtn">+' + (pending.length - 3) + " more</button>"
      : "";

    container.innerHTML = rowsHtml + moreHtml;

    Array.prototype.forEach.call(container.querySelectorAll(".hw-item"), function (rowEl) {
      var id = rowEl.getAttribute("data-id");
      rowEl.querySelector(".hw-check").addEventListener("click", function () {
        var item = state.homework.find(function (h) { return h.id === id; });
        if (item) item.completed = true;
        saveHomework();
        renderHomeHomework();
      });

    if (moreBtn) moreBtn.addEventListener("click", function () { showView("homework"); });

  function renderHome() {
    var today = new Date();
    document.getElementById("homeDate").textContent = today.toLocaleDateString(undefined, {
      weekday: "long", month: "short", day: "numeric"
    });
    var type = state.days[todayKey(today)].type;
    document.getElementById("homeHero").className = "home-hero dt-" + type;
    document.getElementById("homeDayType").textContent = DAY_META[type].name;
    renderAnchorCard();
    renderHomeHomework();

    var daysLeft = daysBetween(today, sf.end);
    var daysLeftText = daysLeft > 0
      ? (daysLeft + (daysLeft === 1 ? " day left in this cycle" : " days left in this cycle"))

    var logHtml = sf.log.length
      ? sf.log.slice().reverse().map(function (entry) {

            '<button class="btn ghost" id="skillLogAddBtn">Add</button>' +

        "</div>" +

    document.getElementById("skillNameInput").addEventListener("input", function (e) {

      saveSkillFocus();

    document.getElementById("skillStartInput").addEventListener("change", function (e) {
      state.skillFocus.start = e.target.value;
      saveSkillFocus();
      renderSkillView();
    });

      state.skillFocus.end = e.target.value;
      saveSkillFocus();
      renderSkillView();

      state.skillFocus.log.push({ date: dateKey(new Date()), note: "Wrapped up: " + oldName });
      var newStart = dateKey(new Date());
      state.skillFocus.name = "";
      state.skillFocus.start = newStart;
      state.skillFocus.end = addMonthsToDateStr(newStart, 3.5);
      saveSkillFocus();
      renderSkillView();
    });
  }

  function renderGoalsView() {
    var container = document.getElementById("goalsContainer");
    var html = GOAL_DOMAINS.map(function (domainId) {

      var tiersHtml = GOAL_TIERS.map(function (tierId) {

  function renderHomeworkView() {
    var listEl = document.getElementById("hwList");
    var todayStr = dateKey(new Date());

    var sorted = state.homework.slice().sort(function (a, b) {
      if (!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
      var ad = a.due || "9999-99-99";
      var bd = b.due || "9999-99-99";
      return ad < bd ? -1 : (ad > bd ? 1 : 0);
    });

    if (!sorted.length) {
      listEl.innerHTML = '<p class="hw-empty">No assignments yet — add one above.</p>';
    } else {
      listEl.innerHTML = sorted.map(function (item) {
        var overdue = !item.completed && item.due && item.due < todayStr;
        var dueLabel = item.due ? formatDueDate(item.due) : "";
        return (
          '<div class="hw-item' + (item.completed ? " done" : "") + (overdue ? " overdue" : "") + '" data-id="' + item.id + '">' +
            '<span class="hw-check' + (item.completed ? " checked" : "") + '">' + (item.completed ? "✓" : "") + "</span>" +
            '<div class="hw-info">' +
              (item.subject ? '<span class="hw-subject">' + escapeHtml(item.subject) + "</span>" : "") +
              '<span class="hw-title">' + escapeHtml(item.title) + "</span>" +
            "</div>" +
            '<span class="hw-due">' + escapeHtml(dueLabel) + "</span>" +
            '<button class="icon-btn delete-btn" data-action="delete" aria-label="Delete">×</button>' +
          "</div>"
        );
      }).join("");
    }

    Array.prototype.forEach.call(listEl.querySelectorAll(".hw-item"), function (rowEl) {
      var id = rowEl.getAttribute("data-id");
      rowEl.querySelector(".hw-check").addEventListener("click", function () {
        var item = state.homework.find(function (h) { return h.id === id; });
        if (item) item.completed = !item.completed;
        saveHomework();
        renderHomeworkView();
      });
      rowEl.querySelector('[data-action="delete"]').addEventListener("click", function () {
        state.homework = state.homework.filter(function (h) { return h.id !== id; });
        saveHomework();
        renderHomeworkView();
      });
    });

  function renderWeekView() {
    var container = document.getElementById("weekViewList");
    if (!container) return;

    var html = WEEK_ORDER.map(function (day) {
      var d = state.days[day];
      var type = d.type;
      var meta = DAY_META[type];

      var kickoffHtml = "";
      if (type === "matchday" && (d.kickoff || d.opponent)) {
        var parts = [];
        if (d.kickoff) parts.push("Kick-off " + escapeHtml(d.kickoff));
        if (d.opponent) parts.push("vs " + escapeHtml(d.opponent));
        kickoffHtml = '<p class="wv-kickoff">' + parts.join(" · ") + "</p>";
      }

        return '<div class="' + cls + '"><span class="wv-time">' + escapeHtml(item.time) +

          '<div class="wv-day-head">' +

          "</div>" +
          kickoffHtml +

  function renderWeek() {
    if (!weekGridEl) return;
    var today = todayKey(new Date());
    var html = WEEK_ORDER.map(function (day) {
      var type = state.days[day].type;
      var activeStyle = DAYTYPE_TO_STYLE[type];
      var isToday = day === today;
      var isSelected = day === state.activeDay;
      var dots = ["train", "school", "game", "bed"].map(function (s) {
        var labelMap = { train: "Training", school: "School", game: "Match", bed: "Rest" };
        return '<button class="dot dot-' + s + (s === activeStyle ? " active" : "") +
          '" data-day="' + day + '" data-style="' + s + '" title="' + labelMap[s] +
          '" aria-label="' + WEEKDAY_LABELS[day] + ": " + labelMap[s] + '"></button>';
      }).join("");
      return (
        '<div class="week-tile tint-' + type + (isToday ? " today" : "") + (isSelected ? " selected" : "") + '">' +
          '<button class="week-day-btn" data-jump="' + day + '">' + WEEKDAY_LABELS[day] + "</button>" +
          '<div class="week-dots" role="group" aria-label="' + WEEKDAY_LABELS[day] + ' type">' + dots + "</div>" +
          '<span class="week-type-label c-' + type + '">' + SHORT_NAME[type] + "</span>" +
        "</div>"
      );
    }).join("");
    weekGridEl.innerHTML = html;
    bindWeekEvents();

  function bindWeekEvents() {
    Array.prototype.forEach.call(weekGridEl.querySelectorAll(".dot"), function (dotEl) {
      dotEl.addEventListener("click", function () {
        var day = dotEl.getAttribute("data-day");
        var style = dotEl.getAttribute("data-style");
        state.days[day].type = STYLE_TO_DAYTYPE[style];
        renderWeek();
        if (day === state.activeDay) renderSheet();
        scheduleSaveDays();
      });
    });
    Array.prototype.forEach.call(weekGridEl.querySelectorAll("[data-jump]"), function (btn) {
      btn.addEventListener("click", function () {
        state.activeDay = btn.getAttribute("data-jump");
        renderWeek();
        renderSheet();
      });
    });
  }

  function rowHtml(item, i, total) {

    var downDis = i === total - 1 ? "disabled" : "";
    var moveBtns =
      '<div class="row-move">' +
        '<button class="icon-btn" data-action="up" ' + upDis + ' aria-label="Move up">▲</button>' +
        '<button class="icon-btn" data-action="down" ' + downDis + ' aria-label="Move down">▼</button>' +

          '<button class="icon-btn delete-btn" data-action="delete" aria-label="Delete note">×</button>' +
        "</div>"

      var labelMap = { train: "Training", school: "School", game: "Match", bed: "Bedtime" };

        '<div class="row-controls">' +
          '<div class="style-dots" role="group" aria-label="Category">' + dots + "</div>" +
          '<label class="big-toggle"><input type="checkbox" data-field="big"' +
            (item.big ? " checked" : "") + "> Emphasize</label>" +
          '<button class="icon-btn delete-btn" data-action="delete" aria-label="Delete block">×</button>' +
        "</div>" +
      "</div>"
    );

  function renderBlocks() {
    var day = state.days[state.activeDay];
    var container = sheetContainerEl.querySelector("#blocksList");
    if (!container) return;
    container.innerHTML = day.blocks.map(function (item, i) {
      return rowHtml(item, i, day.blocks.length);
    }).join("");
    bindBlockEvents();
  }

  function bindBlockEvents() {
    var container = sheetContainerEl.querySelector("#blocksList");
    var day = state.days[state.activeDay];

    Array.prototype.forEach.call(container.querySelectorAll(".row"), function (rowEl) {
      var idx = parseInt(rowEl.getAttribute("data-index"), 10);

      Array.prototype.forEach.call(rowEl.querySelectorAll("input[data-field]"), function (inputEl) {
        var field = inputEl.getAttribute("data-field");
        if (field === "big") {
          inputEl.addEventListener("change", function () {
            day.blocks[idx].big = inputEl.checked;
            var labelInput = rowEl.querySelector(".label-input");
            if (labelInput) labelInput.classList.toggle("emph", inputEl.checked);
            scheduleSaveDays();
          });
        } else {
          inputEl.addEventListener("input", function () {
            day.blocks[idx][field] = inputEl.value;
            scheduleSaveDays();
          });
        }
      });

      Array.prototype.forEach.call(rowEl.querySelectorAll(".dot"), function (dotEl) {
        dotEl.addEventListener("click", function () {
          day.blocks[idx].style = dotEl.getAttribute("data-style");
          renderBlocks();
          scheduleSaveDays();
        });
      });

      var upBtn = rowEl.querySelector('[data-action="up"]');
      var downBtn = rowEl.querySelector('[data-action="down"]');
      var delBtn = rowEl.querySelector('[data-action="delete"]');

      if (upBtn) upBtn.addEventListener("click", function () {
        if (idx === 0) return;
        var tmp = day.blocks[idx - 1];
        day.blocks[idx - 1] = day.blocks[idx];
        day.blocks[idx] = tmp;
        renderBlocks();
        scheduleSaveDays();
      });

      if (downBtn) downBtn.addEventListener("click", function () {
        if (idx === day.blocks.length - 1) return;
        var tmp2 = day.blocks[idx + 1];
        day.blocks[idx + 1] = day.blocks[idx];
        day.blocks[idx] = tmp2;
        renderBlocks();
        scheduleSaveDays();
      });

      if (delBtn) delBtn.addEventListener("click", function () {
        day.blocks.splice(idx, 1);
        renderBlocks();
        scheduleSaveDays();
      });
    });
  }

    var day = state.days[dayKeyStr];

    if (type === "matchday") {
      var kickoffInput = sheetContainerEl.querySelector("#kickoffInput");
      var opponentInput = sheetContainerEl.querySelector("#opponentInput");
      kickoffInput.addEventListener("input", function () {
        day.kickoff = kickoffInput.value;
        scheduleSaveDays();
      });
      opponentInput.addEventListener("input", function () {
        day.opponent = opponentInput.value;
        scheduleSaveDays();
      });
    }

    sheetContainerEl.querySelector("#addBlockBtn").addEventListener("click", function () {
      day.blocks.push(blk("", "", "train", false));
      renderBlocks();
      scheduleSaveDays();
      focusLastLabel();
    });

    sheetContainerEl.querySelector("#addNoteBtn").addEventListener("click", function () {
      day.blocks.push(note(""));
      renderBlocks();
      scheduleSaveDays();
      focusLastLabel();
    });

    renderResetArea();
    footerEl.hidden = false;
  }

  function focusLastLabel() {
    var rows = sheetContainerEl.querySelectorAll(".row");
    if (!rows.length) return;
    var last = rows[rows.length - 1];
    var field = last.querySelector(".label-input, .note-input");
    if (field) field.focus();
    last.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function renderResetArea() {
    resetAreaEl.innerHTML = '<button class="btn subtle" id="resetBtn">Reset to default</button>';
    resetAreaEl.querySelector("#resetBtn").addEventListener("click", function () {
      var dayKeyStr = state.activeDay;
      var type = state.days[dayKeyStr].type;
      resetAreaEl.innerHTML =
        '<div class="confirm-box">Reset ' + WEEKDAY_FULL[dayKeyStr] + " (" + DAY_META[type].name + ') to its default plan?' +
          '<button class="btn danger" id="confirmResetBtn">Yes, reset</button>' +
          '<button class="btn ghost" id="cancelResetBtn">Cancel</button>' +
        "</div>";
      resetAreaEl.querySelector("#confirmResetBtn").addEventListener("click", function () {
        var fresh = clone(defaults()[type]);
        fresh.type = type;
        state.days[dayKeyStr] = fresh;
        renderSheet();
        scheduleSaveDays();
      });
      resetAreaEl.querySelector("#cancelResetBtn").addEventListener("click", renderResetArea);
    });
  }

  function showView(view) {
    state.view = view;
    ["home", "skill", "goals", "homework", "week", "saved"].forEach(function (v) {
      var el = document.getElementById("view-" + v);
      if (el) el.hidden = (v !== view);
    });
    dayTitleEl.textContent = VIEW_META[view].title;
    backBtnEl.hidden = (view === "home");

    if (view === "home") renderHome();
    else if (view === "skill") renderSkillView();
    else if (view === "goals") renderGoalsView();
    else if (view === "homework") renderHomeworkView();
    else if (view === "week") { renderWeek(); renderSheet(); }
    else if (view === "saved") renderWeekView();
  }

  function init() {
    resetAreaEl = document.getElementById("resetArea");
    sheetContainerEl = document.getElementById("sheetContainer");
    dayTitleEl = document.getElementById("pageTitle");
    weekGridEl = document.getElementById("weekGrid");
    anchorCardEl = document.getElementById("anchorCard");
    statusEl = document.getElementById("statusText");
    footerEl = document.getElementById("appFooter");
    backBtnEl = document.getElementById("backBtn");

    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    backBtnEl.addEventListener("click", function () { showView("home"); });
    Array.prototype.forEach.call(document.querySelectorAll(".home-nav-btn"), function (btn) {
      btn.addEventListener("click", function () { showView(btn.getAttribute("data-view")); });
    });

    document.getElementById("hwAddBtn").addEventListener("click", function () {
      var subjectEl = document.getElementById("hwSubjectInput");
      var titleEl = document.getElementById("hwTitleInput");
      var dueEl = document.getElementById("hwDueInput");
      var title = titleEl.value.trim();
      if (!title) { titleEl.focus(); return; }
      state.homework.push({
        id: "hw-" + Date.now() + "-" + Math.floor(Math.random() * 10000),
        subject: subjectEl.value.trim(),
        title: title,
        due: dueEl.value,
        completed: false
      });
      subjectEl.value = "";
      titleEl.value = "";
      dueEl.value = "";
      saveHomework();
      renderHomeworkView();
      titleEl.focus();
    });

    Promise.all([loadDays(), loadAnchorLog(), loadSkillFocus(), loadGoalLadder(), loadHomework()]).then(function (results) {
      state.days = results[0];
      state.anchorLog = results[1];
      state.skillFocus = results[2];
      state.goalLadder = results[3];
      state.homework = results[4];
      state.activeDay = todayKey(new Date());
      showView("home");
    }).catch(function () {
      state.days = defaultDays();
      state.anchorLog = {};
      state.skillFocus = skillFocusDefaults();
      state.goalLadder = goalLadderDefaults();
      state.homework = [];
      state.activeDay = todayKey(new Date());
      showView("home");
      setStatus("Couldn't load saved changes — showing defaults");
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
